<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>RDx Posts</title>
  <meta name="theme-color" content="#050506">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,400..800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script type="module" src="/assets/js/admin.js"></script>
</head>
<body class="admin">
  <header class="top">
    <a class="brand" href="/" aria-label="Back to the RDx site"><span class="mark">RD<i>x</i></span></a>
    <button class="btn btn-ghost btn-sm" id="signout" hidden>Sign out</button>
  </header>

  <main class="admin-main">
    <div class="note" id="msg" role="status" hidden></div>

    <!-- Sign in -->
    <form class="panel" id="login">
      <h1>Post an announcement</h1>
      <p class="muted">For the RDx admin. Enter the posting password.</p>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-red">Sign in</button>
    </form>

    <!-- New post -->
    <form class="panel" id="compose" hidden>
      <h1>New post</h1>
      <fieldset class="kinds">
        <legend>What is it?</legend>
        <label><input type="radio" name="kind" value="announcement" checked><span>Announcement</span></label>
        <label><input type="radio" name="kind" value="tournament"><span>Tournament</span></label>
        <label><input type="radio" name="kind" value="video"><span>Video</span></label>
        <label><input type="radio" name="kind" value="photos"><span>Photos</span></label>
      </fieldset>

      <label>Title<input name="title" maxlength="120" required placeholder="e.g. Diwali doubles tournament"></label>
      <label><span>Details <span class="muted">(optional)</span></span><textarea name="body" rows="5" maxlength="4000" placeholder="Format, entry fee, prizes, who to contact…"></textarea></label>

      <div class="tournament" id="tournament-fields" hidden>
        <div class="row2">
          <label>Date<input type="date" name="date"></label>
          <label>Start time<input type="time" name="time"></label>
        </div>
        <label>Venue<input name="venue" maxlength="160" placeholder="Court / hall name"></label>
        <label><span>Registration link <span class="muted">(optional, https://…)</span></span><input name="register" type="url" placeholder="Google Form, WhatsApp link…"></label>
      </div>

      <div class="media-box">
        <span class="label">Photos and videos</span>
        <label class="drop">
          <input type="file" id="files" accept="image/*,video/*" multiple>
          <b>Add photos or videos</b>
          <span class="muted">Photos up to 10 MB, videos up to 100 MB. For longer videos, upload to YouTube and paste the link below.</span>
        </label>
        <div class="row-yt">
          <input id="yt" type="url" placeholder="YouTube link (optional)">
          <button type="button" class="btn btn-ghost btn-sm" id="add-yt">Add</button>
        </div>
        <ul class="uploads" id="uploads"></ul>
      </div>

      <label class="check"><input type="checkbox" name="pinned"> Pin to the top of the list</label>
      <button class="btn btn-red" id="publish">Publish</button>
    </form>

    <!-- Existing posts -->
    <section class="panel" id="existing" hidden>
      <h2>Published</h2>
      <ul class="posts" id="posts"></ul>
    </section>
  </main>
</body>
</html>
